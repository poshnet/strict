<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<script src="icons.js"></script><script src="shared.js"></script>
<style>
  /* The warm-up video (pre-launch): 1200 x 675, rendered at 1.6x (1920 x 1080), ~28 s. Built to be read on a phone:
     solid black and amber cards, huge type, one short line under each headline, one big visual per rule. The replies
     every launch gets, the question, a card per rule, the lock, then soon. Every element is placed by render(t).
     Wallets and $GAVEL are a demo, not real. */
  .stage { width: 1200px; height: 675px; }
  .big { font-weight: 800; letter-spacing: -0.055em; line-height: 0.96; margin: 0; }
  .full { position: absolute; left: 0; top: 0; width: 1200px; height: 675px; box-sizing: border-box; }
  .full.amber { background: var(--accent); color: #0A0A0B; }
  .full.black { background: #0A0A0B; color: var(--ink); }
  .black .big em { font-style: normal; color: var(--accent); }
  /* on amber, the key words sit in a black sticker */
  .amber .big { line-height: 1.08; }
  .amber .big em { font-style: normal; color: var(--accent); background: #0A0A0B; padding: 0 0.14em 0.04em; border-radius: 0.12em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }

  /* 1: the replies */
  #s1h { left: 70px; top: 54px; }
  #s1h .big { font-size: 78px; }
  #s1h .big span { color: var(--muted); }
  .rep { left: 70px; width: 1060px; box-sizing: border-box; display: flex; gap: 18px; align-items: center; padding: 14px 22px; border-radius: 20px; background: #17171A; border: 2px solid #2A2A2F; }
  .rep .av { width: 52px; height: 52px; border-radius: 50%; flex: 0 0 auto; background: linear-gradient(140deg, #45454C, #1C1C20); }
  .rep .tx { font-size: 38px; font-weight: 700; color: #F4F3EF; letter-spacing: -0.03em; }
  .rep .tx b { color: var(--red); font-weight: 800; }

  /* 2: the question */
  #s2 { display: flex; flex-direction: column; justify-content: center; padding-left: 70px; }
  #s2 .big { font-size: 132px; }

  /* 3: a card per rule */
  .card .chip { position: absolute; left: 70px; top: 62px; display: inline-flex; align-items: center; gap: 12px; height: 54px; padding: 0 22px; border-radius: 999px; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
  .card.black .chip { background: #1E140A; border: 2px solid #3D2814; color: var(--accent-soft); }
  .card.amber .chip { background: #0A0A0B; color: var(--accent); }
  .card .chip .ico { width: 26px; height: 26px; stroke-width: 2.2; }
  .card .big { position: absolute; left: 70px; top: 150px; width: 640px; }
  .card .sub { position: absolute; left: 70px; width: 660px; font-size: 36px; font-weight: 600; line-height: 1.22; letter-spacing: -0.025em; margin: 0; }
  .card.black .sub { color: #C9C7C0; }
  .card.amber .sub { color: #2A1604; }
  .vis { position: absolute; left: 760px; top: 70px; width: 380px; height: 535px; box-sizing: border-box; border-radius: 28px; padding: 30px; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
  .card.black .vis { background: #17171A; border: 2px solid #2A2A2F; }
  .card.amber .vis { background: #0A0A0B; color: var(--ink); }
  .lab { font-size: 28px; font-weight: 700; color: var(--muted); letter-spacing: -0.02em; }
  /* the fee counter */
  .fee { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 150px; letter-spacing: -0.07em; line-height: 1; color: var(--accent); margin-top: 10px; }
  .feebar { height: 26px; border-radius: 999px; background: #2A2A2F; margin-top: 30px; overflow: hidden; }
  .feebar i { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
  /* a buy, and the stamp */
  .wal { display: flex; flex-direction: column; gap: 8px; }
  .wal b { font-size: 38px; letter-spacing: -0.03em; }
  .wal span { font-size: 30px; font-weight: 600; color: var(--muted); letter-spacing: -0.02em; }
  .stampw { position: relative; height: 170px; margin-top: 26px; }
  .stamp { position: absolute; left: 0; top: 30px; padding: 12px 26px; border-radius: 16px; background: var(--red); color: #fff; font-size: 58px; font-weight: 800; letter-spacing: -0.04em; transform-origin: 30% 50%; }
  .stamp-sub { position: absolute; left: 4px; top: 128px; font-size: 26px; font-weight: 700; color: var(--red); letter-spacing: -0.02em; }
  /* block 0 */
  .blk { font-size: 34px; font-weight: 800; letter-spacing: -0.03em; color: var(--muted); }
  .zero { font-size: 150px; font-weight: 800; letter-spacing: -0.07em; line-height: 1; color: var(--ink); margin-top: 6px; }
  .zero small { font-size: 46px; letter-spacing: -0.04em; color: var(--muted); margin-left: 10px; }
  .lockrow { display: flex; align-items: center; gap: 14px; margin-top: 26px; font-size: 30px; font-weight: 700; color: var(--green-ink); letter-spacing: -0.02em; }
  .lockrow .ico { width: 40px; height: 40px; stroke-width: 2.2; color: var(--green-ink); }
  /* the cap */
  .bars { position: relative; display: flex; flex-direction: column; gap: 26px; margin-top: 26px; }
  .bar { height: 40px; border-radius: 999px; background: #26262B; position: relative; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--green); }
  .capl { position: absolute; top: -16px; bottom: -16px; width: 0; border-left: 4px dashed var(--accent); }
  .capt { font-size: 30px; font-weight: 800; color: var(--accent); margin-top: 26px; letter-spacing: -0.02em; }
  /* the copy */
  .copy { position: relative; display: inline-block; font-size: 74px; font-weight: 800; letter-spacing: -0.06em; color: var(--ink); line-height: 1; margin-top: 10px; }
  .copy .strike { position: absolute; left: -6px; top: 52%; height: 12px; border-radius: 6px; background: var(--red); }
  .copyt { font-size: 30px; font-weight: 700; color: var(--red); margin-top: 26px; letter-spacing: -0.02em; }

  /* 4: the lock */
  #s4 { display: flex; flex-direction: column; justify-content: center; gap: 4px; padding-left: 70px; }
  #s4 .big { font-size: 104px; }
  /* 5: soon */
  #end { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
  #end .mark { font-size: 150px; color: #0A0A0B; }
  #end .mark b { color: #fff; }
  #end .big { font-size: 128px; margin-top: 30px; }
  #end .row { display: flex; align-items: center; gap: 18px; margin-top: 34px; }
  #end .wm { font-size: 46px; font-weight: 800; letter-spacing: -0.045em; }
  #end .wm span { color: #5A3008; }
  #end .soon { display: inline-flex; align-items: center; height: 58px; padding: 0 26px; border-radius: 999px; background: #0A0A0B; color: var(--accent); font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
</style></head>
<body><div class="stage" id="stage">

  <div class="full black abs" id="s1">
    <div class="abs" id="s1h"><h1 class="big">Every launch gets<br><span>the same replies.</span></h1></div>
    <div id="reps"></div>
  </div>

  <div class="full amber abs" id="s2"><h2 class="big">What if your<br>coin had <em>rules?</em></h2></div>

  <div id="cards"></div>

  <div class="full black abs" id="s4">
    <h2 class="big" id="l1">Picked at launch.</h2>
    <h2 class="big" id="l2">Locked on chain.</h2>
    <h2 class="big" id="l3"><em>Checked on every buy.</em></h2>
  </div>

  <div class="full amber abs" id="end">
    <div class="mark"><b>{</b>s<b>}</b></div>
    <h2 class="big">Strict can be fun.</h2>
    <div class="row"><span class="wm">strict<span>.fun</span></span><span class="soon">Soon</span></div>
  </div>
</div>
<script>
  window.TOTAL = 28.5;

  // 1: the replies every launch gets (four, short, big)
  const REPLIES = ['<b>sniped</b> in block 0. again.', 'dev <b>sold</b> in the first minute', 'KOLs <b>got in first</b>. every time.', '<b>10 copies</b> of the ticker by lunch'];
  $('reps').innerHTML = REPLIES.map((x, i) => `<div class="abs rep" id="rp${i}" style="top:${246 + i * 100}px"><span class="av"></span><span class="tx">${x}</span></div>`).join('');

  // 3: a card per rule; they alternate black and amber
  const CARDS = [
    { id: 'snipers', name: 'No snipers', head: 'Snipers pay <em>99%.</em>', sub: 'The first seconds cost 99%, falling to 1%.',
      vis: `<div class="lab">Fee right now</div><div class="fee" id="fee">99%</div><div class="feebar"><i id="feebar"></i></div>` },
    { id: 'kols', name: 'No KOLs', head: 'KOLs <em>can’t buy.</em>', sub: '562 KOL wallets, refused until it bonds.',
      vis: stamp('KOL wallet', 'buying 3 SOL', 'KOL list', 1) },
    { id: 'dev', name: 'No dev buy', head: 'The dev <em>can’t buy.</em>', sub: 'The launch wallet is locked out.',
      vis: stamp('Creator wallet', 'buying 5 SOL', 'no dev buy', 2) },
    { id: 'bundles', name: 'No bundles', head: 'Nothing buys in <em>block 0.</em>', sub: 'No bundle gets in before you see it.',
      vis: `<div class="blk">Block 0</div><div class="zero" id="zero">0<small>buys</small></div><div class="lockrow">${icon('lock')}locked by the rule</div>` },
    { id: 'maxWallet', name: 'Max wallet', head: 'Nobody holds <em>the curve.</em>', sub: 'You pick the cap. No wallet buys past it.',
      vis: `<div class="lab">Biggest wallets</div><div class="bars">${[0, 1, 2].map((k) => `<div class="bar"><i id="b${k}"></i></div>`).join('')}<div class="capl" id="capl"></div></div><div class="capt" id="capt">2% cap</div>` },
    { id: 'vamps', name: 'No vamps', head: 'No <em>copycats.</em>', sub: 'Its ticker, name and picture stay its own.',
      vis: `<div class="lab">New coin</div><div class="copy">$GAV3L<span class="strike" id="strike"></span></div><div class="copyt" id="copyt">copy of $GAVEL: refused</div>` },
  ];
  function stamp(who, doing, why, n) {
    return `<div class="wal"><b>${who}</b><span>${doing}</span></div>
      <div class="stampw"><div class="stamp" id="st${n}">REFUSED</div><div class="stamp-sub" id="ss${n}">fails on chain</div></div>`;
  }
  $('cards').innerHTML = CARDS.map((c, i) => `<div class="full abs card ${i % 2 ? 'amber' : 'black'}" id="cd${i}">
      <span class="chip">${icon(c.id)}${c.name}</span>
      <h2 class="big">${c.head}</h2>
      <p class="sub">${c.sub}</p>
      <div class="vis">${c.vis}</div></div>`).join('');
  // fit each headline into its column (at most two lines) and put the line under it
  document.fonts.ready.then(() => CARDS.forEach((_, i) => fit(i)));
  function fit(i) {
    const el = $(`cd${i}`), h = el.querySelector('.big'), sub = el.querySelector('.sub');
    let fs = 118;
    h.style.fontSize = `${fs}px`;
    while ((h.scrollWidth > 650 || h.offsetHeight > fs * 2.3) && fs > 70) { fs -= 2; h.style.fontSize = `${fs}px`; }
    sub.style.top = `${150 + h.offsetHeight + 30}px`;
  }
  CARDS.forEach((_, i) => fit(i));

  const T1 = 4.8, T2 = 6.5, CD = 2.8; // replies until 4.8, the question until 6.5, then 2.8 s a card

  window.render = function (t) {
    // 1 (0 - 4.8): the replies
    show($('s1'), t, 0, T1 - 0.2, { y: 0, d: 0.01, d2: 0.18 });
    show($('s1h'), t, 0.05, 99, { y: 24, d: 0.4 });
    REPLIES.forEach((_, i) => show($(`rp${i}`), t, 0.9 + i * 0.6, 99, { y: 0, x: -40, d: 0.28, s: 0.96 }));

    // 2 (4.8 - 6.5): the question
    show($('s2'), t, T1 - 0.2, T2 - 0.2, { y: 0, x: 60, d: 0.22, d2: 0.18 });

    // 3: a card per rule
    CARDS.forEach((c, i) => {
      const a = T2 - 0.2 + i * CD, el = $(`cd${i}`);
      show(el, t, a, a + CD, { y: 0, x: 60, d: 0.22, d2: 0.18 });
      const p = seg(t, a + 0.4, a + CD - 0.5);
      if (i === 0) {
        const fee = Math.round(99 - 98 * ease(p));
        $('fee').textContent = `${fee}%`;
        $('feebar').style.width = `${fee}%`;
      }
      if (i === 1 || i === 2) {
        const at = a + 0.95, k = ease(seg(t, at, at + 0.22));
        const s = $(`st${i}`);
        s.style.opacity = k;
        s.style.transform = `rotate(-7deg) scale(${1.5 - 0.5 * back(seg(t, at, at + 0.3))})`;
        show($(`ss${i}`), t, at + 0.3, 99, { y: 10, d: 0.25 });
      }
      if (i === 3) show($('zero'), t, a + 0.5, 99, { y: 0, s: 0.7, d: 0.3 });
      if (i === 4) {
        const W = 320, cap = 0.62; // the bars' width, and where the cap sits on it
        $('capl').style.left = `${W * cap}px`;
        [0.55, 0.38, 1.4].forEach((v, k) => {
          const want = v * cap * ease(clamp(p * 1.5 - k * 0.15));
          const b = $(`b${k}`);
          b.style.width = `${Math.min(want, cap) * 100}%`;
          b.style.background = k === 2 && want >= cap ? 'var(--red)' : 'var(--green)';
        });
        $('capt').textContent = p > 0.62 ? '2% cap: stopped' : '2% cap';
        $('capt').style.color = p > 0.62 ? 'var(--red)' : 'var(--accent)';
      }
      if (i === 5) {
        $('strike').style.width = `${ease(seg(t, a + 0.8, a + 1.15)) * 104}%`;
        show($('copyt'), t, a + 1.15, 99, { y: 10, d: 0.25 });
      }
    });

    // 4: the lock
    const s4 = T2 - 0.2 + CARDS.length * CD;
    show($('s4'), t, s4, s4 + 2.6, { y: 0, x: 60, d: 0.22, d2: 0.18 });
    ['l1', 'l2', 'l3'].forEach((id, k) => show($(id), t, s4 + 0.15 + k * 0.5, 99, { y: 30, d: 0.3 }));

    // 5: soon
    show($('end'), t, s4 + 2.6, 99, { y: 0, x: 60, d: 0.25 });
  };
  window.render(0);
</script>
</body></html>
